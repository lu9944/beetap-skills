[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beetap-cli"
version = "1.3.10"
description = "BeeTap 插件 HTTP 控制接口的命令行工具(纯标准库实现,协议 v1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
beetap-cli = "beetap_cli.main:main"

[tool.setuptools]
packages = ["beetap_cli"]
